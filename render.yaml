# Despliegue del backend en Render (plan gratuito). Se usa con: Render -> New -> Blueprint -> elegir este repositorio.
# Las variables con sync:false las pide Render al crear el servicio (son secretos: no se escriben aquí).
services:
  - type: web
    name: practicas-udi-api
    runtime: node
    plan: free
    region: virginia
    rootDir: backend
    buildCommand: pnpm install --frozen-lockfile
    startCommand: node src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_SSL
        value: "true"
      - key: EVENTS_MODE
        value: direct
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
